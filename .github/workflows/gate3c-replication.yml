name: gate3c-replication

on:
  push:
    paths:
      - "experiments/gate3_blackbox_probe.py"
      - "experiments/gate3b_blackbox_fisher.py"
      - "experiments/gate3c_blackbox_replication.py"
      - "kynnys/audit.py"
      - ".github/workflows/gate3c-replication.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Kynnys and experiment dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn
      - name: Run Gate 3c replicated black-box attribution experiment
        run: python -m experiments.gate3c_blackbox_replication --output gate3c_result.json
      - name: Upload Gate 3c receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3c-replication-result
          path: gate3c_result.json
          if-no-files-found: warn
