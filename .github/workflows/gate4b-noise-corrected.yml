name: gate4b-noise-corrected

on:
  push:
    paths:
      - "experiments/gate4b_noise_corrected.py"
      - "experiments/gate4b_noise_corrected_runner.py"
      - "experiments/gate4_stochastic_structured.py"
      - "experiments/gate3_blackbox_probe.py"
      - ".github/workflows/gate4b-noise-corrected.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate4b:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn scipy
      - name: Run Gate 4b noise-corrected experiment
        run: python -m experiments.gate4b_noise_corrected_runner --output gate4b_result.json
      - name: Upload Gate 4b receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4b-noise-corrected-result
          path: gate4b_result.json
          if-no-files-found: warn
