name: gate2-audit

on:
  push:
    paths:
      - "experiments/gate2_audit_text_pipeline.py"
      - "kynnys/audit.py"
      - ".github/workflows/gate2-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate2:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Kynnys and experiment dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn
      - name: Run Gate 2 attribution experiment
        run: python experiments/gate2_audit_text_pipeline.py --output gate2_result.json
      - name: Upload Gate 2 receipt
        uses: actions/upload-artifact@v4
        with:
          name: gate2-audit-result
          path: gate2_result.json
