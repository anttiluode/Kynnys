name: gate4c-budget-sweep

on:
  push:
    paths:
      - "experiments/gate4c_budget_sweep.py"
      - "experiments/gate4b_noise_corrected.py"
      - "experiments/gate4_stochastic_structured.py"
      - "experiments/gate3_blackbox_probe.py"
      - ".github/workflows/gate4c-budget-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate4c:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn scipy
      - name: Run Gate 4c budget sweep
        run: python -m experiments.gate4c_budget_sweep --output gate4c_result.json
      - name: Upload Gate 4c receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate4c-budget-sweep-result
          path: gate4c_result.json
          if-no-files-found: warn
