name: gate3b-fisher

on:
  push:
    paths:
      - "experiments/gate3_blackbox_probe.py"
      - "experiments/gate3b_blackbox_fisher.py"
      - "kynnys/audit.py"
      - ".github/workflows/gate3b-fisher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Kynnys and experiment dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn
      - name: Run Gate 3b Fisher-optimal black-box experiment
        run: python -m experiments.gate3b_blackbox_fisher --output gate3b_result.json
      - name: Upload Gate 3b receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3b-fisher-result
          path: gate3b_result.json
          if-no-files-found: warn
