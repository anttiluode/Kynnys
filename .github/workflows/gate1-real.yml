name: gate1-real

on:
  workflow_dispatch:
  push:
    paths:
      - "experiments/gate1_real_trace.py"
      - ".github/workflows/gate1-real.yml"

permissions:
  contents: read
  actions: read

jobs:
  gate1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Kynnys
        run: python -m pip install -e .
      - name: Offline policy sanity
        run: python experiments/gate1_real_trace.py --fixture --output gate1_fixture.json
      - name: Collect real trace and replay policies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python experiments/gate1_real_trace.py --rounds 16 --sleep 1.5 --output gate1_result.json
      - name: Upload Gate 1 receipts
        uses: actions/upload-artifact@v4
        with:
          name: gate1-real-result
          path: |
            gate1_result.json
            gate1_fixture.json
