name: gate5-evidence-admission

on:
  push:
    paths:
      - "experiments/gate5_evidence_admission.py"
      - "experiments/gate5_evidence_admission_runner.py"
      - ".github/workflows/gate5-evidence-admission.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -e .
          python -m pip install numpy
      - name: Run Gate 5 evidence admission
        run: python -m experiments.gate5_evidence_admission_runner --output gate5_result.json
      - name: Upload Gate 5 receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate5-evidence-admission-result
          path: gate5_result.json
          if-no-files-found: warn
