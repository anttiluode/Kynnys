name: gate2c-orthogonal

on:
  push:
    paths:
      - "experiments/gate2c_orthogonal_probe.py"
      - "experiments/gate2_audit_text_pipeline.py"
      - "kynnys/audit.py"
      - ".github/workflows/gate2c-orthogonal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate2c:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Kynnys and experiment dependencies
        run: |
          python -m pip install -e .
          python -m pip install scikit-learn
      - name: Run Gate 2c orthogonalized probe experiment
        run: python experiments/gate2c_orthogonal_probe.py --output gate2c_result.json
      - name: Upload Gate 2c receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2c-orthogonal-result
          path: gate2c_result.json
          if-no-files-found: warn
